# ==========================================================
# MarketTrack - Application Configuration
# ==========================================================

# Application Name
spring.application.name=MarketTrack

# Server Port: Dynamically binds to cloud platform port (e.g. Render, Railway) or defaults to 8080 locally
server.port=${PORT:8080}

# ==========================================================
# Persistent File-Based H2 Database Configuration
# Data is saved in the './data/markettrackdb.mv.db' file so it survives server restarts
# ==========================================================
spring.datasource.url=jdbc:h2:file:./data/markettrackdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at /h2-console for administrative inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

